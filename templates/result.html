<!DOCTYPE html>
<html>
<head>
  <title>Document</title>
</head>
<body>
    <h2>{{ username }}</h2>
<h1>Test result</h1>

<p>Score: {{ score }} / {{ total }}</p>
<p>Time Submitted: {{ time }}</p>

<a href="/"><button>Go Home</button></a>

{% if score == total %}
<p>Excellent! 🎉</p>
{% elif score >= total/2 %}
<p>Good job 👍</p>
{% else %}
<p>Try again ❌</p>
{% endif %}
<a href="/test"><button>retake test</button></a>
</body>
</html>
