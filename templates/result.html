<!DOCTYPE html>
<html>
<head>
<title>Result</title>

<style>
body{
    background:#121212;
    color:#eee;
    font-family:Arial;
    text-align:center;
}

.container{
    background:#1e1e1e;
    width:50%;
    margin:auto;
    margin-top:100px;
    padding:30px;
    border-radius:10px;
}

button{
    padding:10px 15px;
    background:#4da3ff;
    border:none;
    color:white;
    border-radius:5px;
}
</style>

</head>

<body>

<div class="container">
<h2>{{ username }}</h2>
<h1>Test Result</h1>

<h2>{{ score }} / {{ total }}</h2>

<p>Time Submitted: {{ time }}</p>

{% if score == total %}
<p>Excellent 🎉</p>
{% elif score >= total/2 %}
<p>Good job 👍</p>
{% else %}
<p>Try again ❌</p>
{% endif %}

<br>

<a href="/test"><button>Retake Test</button></a>
<br><br>
<a href="/"><button>Home</button></a>

</div>

</body>
</html>
