<!DOCTYPE html>
<html>
<head>
<title>Test</title>

<style>
body{
    background:#121212;
    color:#eee;
    font-family:Arial;
}

.container{
    width:60%;
    margin:auto;
    padding:20px;
}

.question{
    background:#1e1e1e;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

button{
    padding:12px 20px;
    background:#4da3ff;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Answer All Questions</h1>
<h2 id="timer">Time Left: 60s</h2>
<form method="POST">

<h2>Candidate: {{ username }}</h2>
<input type="hidden" name="username" value="{{ username }}">

{% for question in questions %}
<div class="question">

<p><strong>{{ loop.index }}. {{ question.text }}</strong></p>

{% set q_index = loop.index0 %}

{% for option in question.options %}
<label>
<input type="radio" name="q{{ q_index }}" value="{{ option }}" required>
{{ option }}
</label><br>
{% endfor %}

</div>
{% endfor %}

<button type="submit">Submit Test</button>

</form>

</div>

<script>
let timeLeft = 60;

function updateTimer(){
    document.getElementById("timer").innerText = "Time Left: " + timeLeft + "s";
    timeLeft--;

    if(timeLeft < 0){
        document.forms[0].submit();
    }
}

setInterval(updateTimer, 1000);
</script>

</body>
</html>
